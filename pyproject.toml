[project]
name = "sentiment-backtester"
version = "0.1.0"
description = "A sentiment-driven algorithmic trading backtester"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy",
    "yfinance",
    "requests",

]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[build-system]
requires = ["setuptools>68"]
build-backend = "setuptools.build_meta"